# Ask PSI demo questions (docs/SPEC.md §8.7). Shown as suggestion chips, pre-warmed by
# `pnpm rag:warm` and checked by `pnpm rag:eval`.
# expected_slugs: filled in by the research team (Anna + Juliana, H+20) — the fichas a good
#   answer must cite. Use ficha slugs (e.g. same) or PSI-IDs for investigations without a ficha.
# kind: normal | out_of_scope (must be declined) | no_data (must say there is no curated PSI data)

- id: smoke-detection
  kind: normal
  question:
    en: Which PSI experiments test smoke detection in microgravity, and what aerosol sizes did they measure?
    pt-BR: Quais experimentos do PSI testam detecção de fumaça em microgravidade, e que tamanhos de aerossol mediram?
  expected_slugs: []

